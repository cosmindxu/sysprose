name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · unit/integration · build · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The OMG library `test/conformance/corpus.test.ts` parses, at the commit
      # `src/library/std/manifest.json` names — the one the maintainer's
      # `~/.stdlib-src` holds. Without it that file runs one placeholder case
      # instead of sixteen, and this run's `docs/TEST-SUMMARY.md` (the last
      # step) could never be the committed one: run 37920809712, on 8cd1bfa,
      # counted 4172 against the summary's 4187, that row and no other.
      # Read-only test input, never committed, and fetched OUTSIDE the workspace,
      # which the claims guard walks. Sparse and shallow: one directory at one
      # commit, ~3 MB.
      - name: Fetch the OMG sysml.library the corpus tests read
        run: |
          set -euo pipefail
          dir="$HOME/.stdlib-src"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/Systems-Modeling/SysML-v2-Release
          git -C "$dir" sparse-checkout set sysml.library
          git -C "$dir" fetch -q --depth 1 --filter=blob:none origin ee25530ed24b8c93a0e3e4b8d5fbfaa5a8d8ffb4
          git -C "$dir" checkout -q FETCH_HEAD

      - name: Typecheck
        run: npm run typecheck

      # The suite runs ONCE. The JSON reporter rides beside the default one, so
      # the summary check at the end reads this run rather than starting a
      # second: this is the job's longest step (9 of its 16 minutes on 8cd1bfa).
      - name: Unit + integration + conformance + server + interop (Vitest)
        id: vitest
        run: npm test -- --reporter=json --outputFile.json=test-results/unit-results.json

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright)
        run: npx playwright test

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # `docs/TEST-SUMMARY.md` is regenerated from the Vitest step's JSON and
      # must come out byte-identical to the committed file, so a push that adds
      # or removes a test, or adds, removes or renames a test file, without
      # refreshing the summary fails here, with the rows that moved in the diff.
      # It runs whenever the Vitest step was green, whatever the build and E2E
      # did. A run with a skip is refused rather than summarised (the generator
      # exits 1 and writes nothing): the summary records green runs only, and a
      # skip here means a case the committed summary counts as passed did not run.
      - name: docs/TEST-SUMMARY.md is this run's
        if: ${{ !cancelled() && steps.vitest.outcome == 'success' }}
        run: |
          set -euo pipefail
          npx tsx scripts/gen-test-report.ts --from test-results/unit-results.json
          if ! git diff --exit-code docs/TEST-SUMMARY.md; then
            echo "::error file=docs/TEST-SUMMARY.md::not this run's summary (diff above): refresh it from a green gate run, as CLAUDE.md's Validation gate says"
            exit 1
          fi
